name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          diff <(gofmt -l .) <(printf '')

      - name: go vet
        run: |
          go vet ./...
          go vet ./testdata/nethttp-basic

      - name: go build
        run: |
          go build -o /dev/null ./...
          go build -o /dev/null ./testdata/nethttp-basic

      - name: go test
        run: go test ./... -race -v
